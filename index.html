<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>大港乐跑团 - 燃情七月半程接力</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<!-- ===== DYNAMIC BACKGROUND ===== -->
<div class="bg" id="mainBg">
  <!-- Scroll-reactive gradient overlay -->
  <div class="bg-gradient-overlay" id="bgGradient"></div>

  <!-- Glowing orbs -->
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>

  <!-- Particle canvas -->
  <canvas id="particleCanvas"></canvas>

  <!-- Running figures with sprint animation -->
  <div class="runner-runner" id="runnerBack" style="bottom:8%;left:2%">
    <svg viewBox="0 0 200 200" class="runner-svg">
      <g class="runner-body-group">
        <!-- Head -->
        <circle cx="100" cy="32" r="12" fill="none" stroke="rgba(255,107,53,0.25)" stroke-width="3"/>
        <!-- Torso -->
        <line x1="100" y1="44" x2="100" y2="100" stroke="rgba(255,107,53,0.25)" stroke-width="3" stroke-linecap="round"/>
        <!-- Arms swinging -->
        <line class="arm arm-l" x1="100" y1="55" x2="70" y2="85" stroke="rgba(255,107,53,0.25)" stroke-width="2.5" stroke-linecap="round"/>
        <line class="arm arm-r" x1="100" y1="55" x2="130" y2="75" stroke="rgba(255,107,53,0.25)" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Legs running -->
        <line class="leg leg-l" x1="100" y1="100" x2="75" y2="155" stroke="rgba(255,107,53,0.25)" stroke-width="2.5" stroke-linecap="round"/>
        <line class="leg leg-r" x1="100" y1="100" x2="125" y2="145" stroke="rgba(255,107,53,0.25)" stroke-width="2.5" stroke-linecap="round"/>
      </g>
    </svg>
  </div>

  <div class="runner-runner" id="runnerMid" style="bottom:20%;right:10%">
    <svg viewBox="0 0 200 200" class="runner-svg">
      <g class="runner-body-group">
        <circle cx="100" cy="30" r="13" fill="none" stroke="rgba(255,46,99,0.3)" stroke-width="3"/>
        <line x1="100" y1="43" x2="100" y2="105" stroke="rgba(255,46,99,0.3)" stroke-width="3" stroke-linecap="round"/>
        <line class="arm arm-l" x1="100" y1="58" x2="65" y2="90" stroke="rgba(255,46,99,0.3)" stroke-width="2.5" stroke-linecap="round"/>
        <line class="arm arm-r" x1="100" y1="58" x2="135" y2="80" stroke="rgba(255,46,99,0.3)" stroke-width="2.5" stroke-linecap="round"/>
        <line class="leg leg-l" x1="100" y1="105" x2="70" y2="160" stroke="rgba(255,46,99,0.3)" stroke-width="2.5" stroke-linecap="round"/>
        <line class="leg leg-r" x1="100" y1="105" x2="130" y2="150" stroke="rgba(255,46,99,0.3)" stroke-width="2.5" stroke-linecap="round"/>
      </g>
    </svg>
  </div>

  <div class="runner-runner" id="runnerFront" style="bottom:3%;right:30%">
    <svg viewBox="0 0 200 200" class="runner-svg">
      <g class="runner-body-group">
        <circle cx="100" cy="28" r="14" fill="none" stroke="rgba(255,210,63,0.35)" stroke-width="3.5"/>
        <line x1="100" y1="42" x2="100" y2="108" stroke="rgba(255,210,63,0.35)" stroke-width="3.5" stroke-linecap="round"/>
        <line class="arm arm-l" x1="100" y1="60" x2="60" y2="95" stroke="rgba(255,210,63,0.35)" stroke-width="3" stroke-linecap="round"/>
        <line class="arm arm-r" x1="100" y1="60" x2="140" y2="85" stroke="rgba(255,210,63,0.35)" stroke-width="3" stroke-linecap="round"/>
        <line class="leg leg-l" x1="100" y1="108" x2="65" y2="165" stroke="rgba(255,210,63,0.35)" stroke-width="3" stroke-linecap="round"/>
        <line class="leg leg-r" x1="100" y1="108" x2="135" y2="155" stroke="rgba(255,210,63,0.35)" stroke-width="3" stroke-linecap="round"/>
      </g>
    </svg>
  </div>

  <!-- Energy pulse rings -->
  <div class="ring ring-1"></div>
  <div class="ring ring-2"></div>
  <div class="ring ring-3"></div>

  <!-- Speed streaks -->
  <div class="streak"></div><div class="streak"></div><div class="streak"></div><div class="streak"></div>
  <div class="streak"></div><div class="streak"></div><div class="streak"></div><div class="streak"></div>
</div>

<!-- ===== NAV ===== -->
<nav class="nav">
  <div class="brand" onclick="showPage('home')">🏃 大港乐跑团</div>
  <div class="nav-links">
    <button class="nav-btn active" data-page="home" onclick="showPage('home')">首页</button>
    <button class="nav-btn" data-page="register" onclick="showPage('register')">报名</button>
  </div>
</nav>

<!-- HOME -->
<div class="page active" id="page-home">
  <div class="wrap">
    <div class="hero">
      <div class="hero-tag"><span class="dot"></span> 大港乐跑团 · 燃情七月</div>
      <h1>燃情七月<br>半程接力 🏅</h1>
      <p>每一步都是对自我的超越，每一公里都书写着坚持的故事。选择你的奔跑日，加入这场青春盛会！</p>
    </div>
    <div class="stats">
      <div class="stat-item"><div class="stat-value" id="statsTotal">--</div><div class="stat-label">已报名</div></div>
      <div class="stat-item"><div class="stat-value" id="statsDays">--</div><div class="stat-label">已占日期</div></div>
      <div class="stat-item"><div class="stat-value" id="statsSlots">--</div><div class="stat-label">剩余日期</div></div>
    </div>
    <div class="progress-wrap">
      <div class="progress-meta"><span>报名进度</span><span id="progressPct">0/31</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>
    <div class="reg-section" id="regSection">
      <div class="reg-header" onclick="toggleRegList()">
        <span>📋 报名详情 (<span id="regCount">0</span>人)</span>
        <span id="regToggle">展开 ▸</span>
      </div>
      <div class="reg-body" id="regBody"></div>
    </div>
    <div style="text-align:center;margin-top:28px">
      <button class="btn btn-primary" onclick="showPage('register')">📝 立即报名</button>
    </div>
  </div>
</div>

<!-- REGISTER -->
<div class="page" id="page-register">
  <div class="wrap">
    <div class="card" id="registerForm">
      <div class="card-title">📝 报名参赛</div>
      <div class="card-desc">选择7月任意一天作为你的奔跑日</div>
      <div class="field">
        <div class="field-label">选择日期 *</div>
        <div class="date-grid" id="dateGrid"></div>
      </div>
      <div class="field">
        <div class="field-label">姓名 *</div>
        <input class="input" id="inputName" placeholder="请输入真实姓名" maxlength="20" oninput="updateSubmitBtn()">
      </div>
      <button class="btn btn-primary" id="submitBtn" onclick="submitRegistration()" disabled style="width:100%">🚀 确认报名</button>
    </div>
    <div class="card" id="successCard" style="display:none;text-align:center">
      <div style="font-size:48px;margin-bottom:12px">🎉</div>
      <div class="card-title">报名成功！</div>
      <div style="font-size:36px;font-weight:800;color:var(--primary);margin:12px 0" id="successDate"></div>
      <div class="card-desc" id="successName"></div>
      <button class="btn btn-ghost" onclick="showPage('home')" style="margin-top:20px">← 返回首页</button>
    </div>
  </div>
</div>

<!-- ADMIN MODAL -->
<div class="modal-bg" id="adminModal">
  <div class="modal">
    <button class="modal-x" onclick="closeAdmin()">×</button>
    <div id="adminLogin">
      <div class="modal-title">🔐 管理员登录</div>
      <div class="field" style="margin-bottom:20px">
        <div class="field-label">密码</div>
        <input class="input" type="password" id="adminPass" placeholder="请输入密码" onkeydown="if(event.key==='Enter')doAdminLogin()">
      </div>
      <button class="btn-login" onclick="doAdminLogin()">登录</button>
    </div>
    <div id="adminPanel" style="display:none">
      <div class="admin-head"><div class="modal-title">📊 后台管理</div><button class="btn-danger-sm" onclick="doAdminLogout()">退出</button></div>
      <div class="admin-stats"><span>总报名: <strong id="adminTotal">0</strong></span><span>已占日期: <strong id="adminDays">0</strong></span></div>
      <div class="admin-btns"><button class="btn-primary-sm" onclick="exportCSV()">📥 导出CSV</button></div>
      <div class="tbl-wrap">
        <table class="table"><thead><tr><th>ID</th><th>姓名</th><th>手机</th><th>性别</th><th>年龄</th><th>奔跑日</th><th>备注</th><th>时间</th><th>操作</th></tr></thead><tbody id="adminBody"></tbody></table>
      </div>
      <div class="empty" id="emptyAdmin" style="display:none">📭 暂无报名数据</div>
    </div>
  </div>
</div>

<div class="toasts" id="toastContainer"></div>
<div class="sync" id="syncStatus"></div>
<div class="footer"><a href="#" onclick="openAdmin();return false">管理员入口</a></div>

<script src="js/main.js"></script>
<script>
document.getElementById('adminModal').addEventListener('click',function(e){if(e.target===this)closeAdmin();});

// ===== SCROLL-REACTIVE BACKGROUND: black → deep blue → red =====
(function(){
  let bgGradient = document.getElementById('bgGradient');
  let orbs = document.querySelectorAll('.bg-orb');
  let scrollTicking = false;
  window.addEventListener('scroll', function(){
    if (!scrollTicking) {
      requestAnimationFrame(function(){
        let scrollY = window.scrollY;
        let maxScroll = document.body.scrollHeight - window.innerHeight;
        let progress = maxScroll > 0 ? Math.min(scrollY / maxScroll, 1) : 0;
        if (bgGradient) bgGradient.style.opacity = Math.min(progress * 1.5, 1);
        orbs.forEach(function(orb, i){
          orb.style.transform = 'translateY(' + (scrollY * (i+1) * 20 / 100) + 'px)';
        });
        scrollTicking = false;
      });
      scrollTicking = true;
    }
  });
})();

// ===== PARTICLE SYSTEM: diffuse from runner positions =====
(function(){
  let canvas = document.getElementById('particleCanvas');
  if (!canvas) return;
  let ctx = canvas.getContext('2d');
  let particles = [];
  let runners = [];
  let W, H;
  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    runners = [];
    document.querySelectorAll('.runner-runner').forEach(function(el){
      let r = el.getBoundingClientRect();
      runners.push({x: r.left + r.width/2, y: r.top + r.height/2});
    });
  }
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('scroll', resize);
  function mkP(x, y, fromRunner){
    let a = Math.random()*Math.PI*2;
    let sp = fromRunner ? Math.random()*0.8+0.2 : Math.random()*0.3;
    let c = ['255,107,53','255,46,99','255,210,63','100,180,255'][Math.floor(Math.random()*4)];
    return {x:x, y:y, r:Math.random()*2.5+0.5, dx:Math.cos(a)*sp, dy:Math.sin(a)*sp-(fromRunner?0.3:0), c:c, life:1, decay:fromRunner?0.003+Math.random()*0.004:0.001+Math.random()*0.002};
  }
  for(let i=0;i<80;i++){
    let r = runners[Math.floor(Math.random()*runners.length)];
    if(r) particles.push(mkP(r.x+(Math.random()-0.5)*60, r.y+(Math.random()-0.5)*60, true));
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    if(Math.random()<0.4 && runners.length>0){
      let r=runners[Math.floor(Math.random()*runners.length)];
      particles.push(mkP(r.x+(Math.random()-0.5)*40, r.y+(Math.random()-0.5)*40, true));
    }
    if(Math.random()<0.15) particles.push(mkP(Math.random()*W, Math.random()*H, false));
    for(let i=particles.length-1;i>=0;i--){
      let p=particles[i];
      p.x+=p.dx; p.y+=p.dy; p.life-=p.decay;
      if(p.life<=0||p.x<-50||p.x>W+50||p.y<-50||p.y>H+50){particles.splice(i,1);continue;}
      ctx.beginPath(); ctx.arc(p.x,p.y,Math.max(0.3,p.r*p.life),0,Math.PI*2);
      ctx.fillStyle='rgba('+p.c+','+(p.life*0.6)+')'; ctx.fill();
    }
    for(let i=0;i<particles.length;i++){
      for(let j=i+1;j<particles.length;j++){
        let dx=particles[i].x-particles[j].x, dy=particles[i].y-particles[j].y;
        let d=Math.sqrt(dx*dx+dy*dy);
        if(d<100&&particles[i].life>0.2&&particles[j].life>0.2){
          ctx.beginPath(); ctx.moveTo(particles[i].x,particles[i].y); ctx.lineTo(particles[j].x,particles[j].y);
          ctx.strokeStyle='rgba(255,107,53,'+(0.04*(1-d/100)*Math.min(particles[i].life,particles[j].life))+')';
          ctx.lineWidth=0.5; ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
</body>
</html>
